apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'com.linagora.twakevisio.segmentation'
version = '0.1.0'

android {
  namespace 'com.linagora.twakevisio.segmentation'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
  lint {
    abortOnError true
  }
}

dependencies {
  // MLKit Selfie Segmentation, EMBARQUÉ dans l'application (`segmentation-selfie`)
  // et non téléchargé à la demande par les Google Play Services. C'est ce que
  // demande une mesure : un modèle dont l'absence ferait échouer le premier
  // appel au lieu de mesurer un temps.
  //
  // Le poids embarqué est le prix de ce choix, et il fait partie du chiffrage :
  // à relever sur l'APK produit.
  implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'
}
