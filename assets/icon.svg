<!--
  L'icône de Twake Visio, source de vérité. Tous les PNG du dépôt en dérivent,
  et `scripts/make-icons.sh` les régénère.

  **Reconstituée, pas copiée.** L'original n'existait qu'en tuile de lanceur, à
  32 px. La géométrie a donc été relevée pixel par pixel sur cette tuile, puis
  reproduite ici en vecteur ; le rendu de ce fichier, ramené à 32 px, redonne
  exactement les mêmes mesures que la référence :

    glyphe 21x14 sur 32 · corps x 5..19 y 9..22 · objectif x 22..25 y 12..19
    écart corps/objectif 2 px

  Les deux arrêts du dégradé viennent d'un ajustement par moindres carrés sur
  les 351 pixels intérieurs de la tuile, et non d'un prélèvement ponctuel : un
  seul pixel, aux bords, est mélangé au fond blanc et donne une couleur fausse.

  **Plein cadre, et c'est délibéré.** La tuile d'origine est un squircle posé
  sur du blanc. Une icône d'application ne doit pas l'être : iOS et Android
  appliquent LEUR propre masque, et un coin arrondi dessiné dans l'image
  ressortirait comme un liseré blanc à l'intérieur du masque du système.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="fond" x1="0" y1="1024" x2="1024" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00AD5C" />
      <stop offset="1" stop-color="#B6EC3D" />
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#fond)" />
  <!-- Le corps de la caméra. -->
  <rect x="160" y="288" width="480" height="448" rx="104" fill="#FFFFFF" />
  <!-- L'objectif. Le trapèze est tracé RÉTRÉCI, puis dilaté par un contour de
       la même couleur avec des jointures rondes : c'est ce qui lui donne ses
       coins arrondis sans avoir à poser quatre arcs à la main. Le contour fait
       64 d'épaisseur, donc 32 de chaque côté ; les sommets sont rentrés
       d'autant pour que l'étendue finale soit bien x 704..840. -->
  <path
    d="M736,456 L808,400 L808,624 L736,568 Z"
    fill="#FFFFFF"
    stroke="#FFFFFF"
    stroke-width="64"
    stroke-linejoin="round"
  />
</svg>
