<!--
  Le PREMIER PLAN de l'icône adaptative Android : le glyphe seul, sur du
  transparent. Le fond est fourni à part (`adaptive-icon-background.svg`), un
  dégradé ne pouvant pas se déclarer dans `adaptiveIcon.backgroundColor`.

  **Aucune réduction, et c'est mesuré.** La boîte du glyphe fait 384x256 centrée
  sur 1024 : son coin est donc à sqrt(192² + 128²) / 1024 = 0,225 du centre,
  quand le masque circulaire d'Android garantit 0,333. La caméra PLEINE de la
  version précédente débordait, elle, à 0,349 et demandait 85 % ; ce contour
  passe sans être touché.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <g transform="translate(256,704) scale(1,-1)">
    <path d="M320 277V107H107V277ZM341 320H85Q76 320 70.0 314.0Q64 308 64 299V85Q64 76 70.0 70.0Q76 64 85 64H341Q350 64 356.5 70.0Q363 76 363 85V160L448 75V309L363 224V299Q363 308 356.5 314.0Q350 320 341 320Z" fill="#FFFFFF" />
  </g>
</svg>
